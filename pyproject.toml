[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "auracast-player"
version = "0.1.2"
description = "A Sendspin player that broadcasts what it receives over Bluetooth LE Audio (Auracast)."
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "aiosendspin==10.2.2",
  "bumble==0.0.235",
  "python-statemachine==3.2.2",
  "serialx==1.15.1",
  "lc3py @ git+https://github.com/google/liblc3.git@v1.1.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.8",
]

[project.scripts]
auracast-player = "auracast_player.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/auracast_player"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E", "F", "I", "UP", "B", "ASYNC", "RUF", "SIM", "PL",
  "TC", "PT", "C4", "RET", "PERF", "T20", "S", "LOG", "G", "PIE", "N", "FBT",
]
# S101: the asserts only narrow Optional attributes for mypy, they are not runtime checks.
ignore = ["PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["FBT"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["lc3", "bumble.*"]
ignore_missing_imports = true
